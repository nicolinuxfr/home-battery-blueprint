  battery_3_cooldown_seconds: !input battery_3_cooldown_seconds
  battery_3_target_power_entity: !input battery_3_target_power_entity
  battery_3_target_power_uses_absolute_value: !input battery_3_target_power_uses_absolute_value
  battery_3_connected_to_solar_panels: !input battery_3_connected_to_solar_panels
  battery_3_actual_power_sensor: !input battery_3_actual_power_sensor
  battery_3_discharge_actions: !input battery_3_discharge_actions
  battery_3_charge_actions: !input battery_3_charge_actions
  
  battery_4_soc_sensor: !input battery_4_soc_sensor
  battery_4_max_discharge_w: !input battery_4_max_discharge_w
  battery_4_min_discharge_soc_pct: !input battery_4_min_discharge_soc_pct
  battery_4_max_charge_w: !input battery_4_max_charge_w
  battery_4_cooldown_seconds: !input battery_4_cooldown_seconds
  battery_4_target_power_entity: !input battery_4_target_power_entity
  battery_4_target_power_uses_absolute_value: !input battery_4_target_power_uses_absolute_value
  battery_4_connected_to_solar_panels: !input battery_4_connected_to_solar_panels
  battery_4_actual_power_sensor: !input battery_4_actual_power_sensor
  battery_4_discharge_actions: !input battery_4_discharge_actions
  battery_4_charge_actions: !input battery_4_charge_actions

  trigger_entity_id: >-
    {% if trigger is defined and trigger.platform == 'state' and trigger.entity_id is defined %}
      {{ trigger.entity_id }}
    {% else %}
      
    {% endif %}
  triggered_by_off_peak_entity: "{{ trigger_entity_id in off_peak_entities }}"
  triggered_by_house_power_sensor: "{{ trigger_entity_id == house_power_sensor }}"
  triggered_by_start_or_reload: >-
    {{ trigger is defined
       and trigger.platform in ['homeassistant', 'event'] }}
  off_peak_trigger_entered_active: >-
    {% if triggered_by_off_peak_entity and trigger is defined and trigger.to_state is not none %}
      {{ trigger.to_state.state == 'on' }}
    {% else %}
      false
    {% endif %}
  trigger_from_house_power_w: >-
    {% if triggered_by_house_power_sensor and trigger is defined and trigger.from_state is not none %}
      {% set value = trigger.from_state.state %}
      {% if is_number(value) %}
        {{ value | float(0) }}
      {% else %}
        none
      {% endif %}
    {% else %}
      none
    {% endif %}
  trigger_to_house_power_w: >-
    {% if triggered_by_house_power_sensor and trigger is defined and trigger.to_state is not none %}
      {% set value = trigger.to_state.state %}
      {% if is_number(value) %}
        {{ value | float(0) }}
      {% else %}
        none
      {% endif %}
    {% else %}
      none
    {% endif %}
  house_power_trigger_delta_w: >-
    {% if trigger_from_house_power_w is not none and trigger_to_house_power_w is not none %}
      {{ ((trigger_to_house_power_w | float(0)) - (trigger_from_house_power_w | float(0))) | abs }}
    {% else %}
      none
    {% endif %}
  should_skip_small_house_power_delta: >-
    {% if not triggered_by_house_power_sensor %}
      false
    {% elif control_deadband_w | float(0) <= 0 %}
      false
    {% elif house_power_trigger_delta_w is none %}
      false
    {% else %}
      {{ house_power_trigger_delta_w | float(0) < control_deadband_w | float(0) }}
    {% endif %}
  house_power_state: "{{ states(house_power_sensor) }}"
  house_power_valid: "{{ is_number(house_power_state) }}"
  house_power_w: "{{ house_power_state | float(0) if house_power_valid | bool else 0 }}"

  # Generated slot state treats actual-power telemetry as a guardrail: only fresh
  # telemetry can prove that a battery is stalled. When telemetry is old or stale,
  # allocation falls back to the commanded target and waits for a fresh reading.
  slot_1_used: "{{ battery_1_soc_sensor != '' }}"
  slot_1_soc: "{{ states(battery_1_soc_sensor) | float(0) if slot_1_used else 0 }}"
  slot_1_target_entity_configured: "{{ battery_1_target_power_entity != '' }}"
  slot_1_target_power_state: >-
    {% if slot_1_target_entity_configured %}
      {{ states(battery_1_target_power_entity) }}
    {% else %}
      0
    {% endif %}
  slot_1_target_last_changed_ts: >-
    {% if slot_1_target_entity_configured %}
      {% set target_state = states[battery_1_target_power_entity] %}
      {{ as_timestamp(target_state.last_changed, 0) if target_state is not none else 0 }}
    {% else %}
      0
    {% endif %}
  slot_1_target_age_s: >-
    {% if slot_1_target_last_changed_ts | float(0) > 0 %}
      {{ [run_started_ts | float(0) - (slot_1_target_last_changed_ts | float(0)), 0] | max }}
    {% else %}
      0
    {% endif %}
  slot_1_response_grace_s: "{{ [20, battery_1_cooldown_seconds | float(0)] | max }}"
  slot_1_current_target_w: >-
    {% if slot_1_target_power_state in ['unknown', 'unavailable', 'none', ''] %}
      0
    {% else %}
      {{ slot_1_target_power_state | float(0) }}
    {% endif %}
  slot_1_current_target_sign: >-
    {% if slot_1_current_target_w | float(0) > 0 %}
      1
    {% elif slot_1_current_target_w | float(0) < 0 %}
      -1
    {% else %}
      0
    {% endif %}
  slot_1_actual_power_sensor_configured: "{{ battery_1_actual_power_sensor != '' }}"
  slot_1_actual_power_state: >-
    {% if slot_1_actual_power_sensor_configured %}
      {{ states(battery_1_actual_power_sensor) }}
    {% else %}
      0
    {% endif %}
  slot_1_actual_power_last_updated_ts: >-
    {% if slot_1_actual_power_sensor_configured %}
      {% set actual_state = states[battery_1_actual_power_sensor] %}
      {{ as_timestamp(actual_state.last_updated, 0) if actual_state is not none else 0 }}
    {% else %}
      0
    {% endif %}
  slot_1_actual_power_age_s: >-
    {% if slot_1_actual_power_last_updated_ts | float(0) > 0 %}
      {{ [run_started_ts | float(0) - (slot_1_actual_power_last_updated_ts | float(0)), 0] | max }}
    {% else %}
      999999
    {% endif %}
  slot_1_actual_power_w: >-
    {% if slot_1_actual_power_state in ['unknown', 'unavailable', 'none', ''] %}
      0
    {% else %}
      {{ slot_1_actual_power_state | float(0) }}
    {% endif %}
  slot_1_actual_power_valid: "{{ slot_1_actual_power_sensor_configured | bool and is_number(slot_1_actual_power_state) }}"
  slot_1_actual_discharge_w: "{{ [slot_1_actual_power_w | float(0), 0] | max }}"
  slot_1_actual_charge_w: "{{ [0 - (slot_1_actual_power_w | float(0)), 0] | max }}"
  slot_1_actual_power_fresh: >-
    {% if not (slot_1_actual_power_valid | bool) %}
      false
    {% else %}
      {{ slot_1_actual_power_age_s | float(999999) <= [slot_1_response_grace_s | float(0), 45] | max }}
    {% endif %}
  slot_1_actual_power_stale: >-
    {{ slot_1_actual_power_sensor_configured | bool
       and (
         not (slot_1_actual_power_valid | bool)
         or slot_1_actual_power_age_s | float(999999) > actual_power_stale_timeout_s | float(0)
       ) }}
  slot_1_actual_power_usable: >-
    {{ slot_1_actual_power_valid | bool
       and not (slot_1_actual_power_stale | bool) }}
  slot_1_effective_balance_power: >-
    {% set current_target = slot_1_current_target_w | float(0) %}
    {% if current_target == 0 %}
      {% if slot_1_actual_power_usable | bool %}
        {{ (slot_1_actual_discharge_w | float(0)) - (slot_1_actual_charge_w | float(0)) }}
      {% else %}
        0
      {% endif %}
    {% elif not (slot_1_actual_power_sensor_configured | bool) %}
      {{ current_target }}
    {% elif slot_1_actual_power_usable | bool %}
      {{ (slot_1_actual_discharge_w | float(0)) - (slot_1_actual_charge_w | float(0)) }}
    {% elif slot_1_actual_power_stale | bool %}
      {{ current_target }}
    {% else %}
      {{ current_target }}
    {% endif %}
  slot_1_reserved_balance_power: >-
    {% set current_target = slot_1_current_target_w | float(0) %}
    {% if current_target == 0 %}
      {{ slot_1_effective_balance_power | float(0) }}
    {% elif slot_1_target_age_s | float(0) < slot_1_response_grace_s | float(0) %}
