          description: "Délai minimal entre deux mises à jour actives de consigne pour cette batterie. Un cooldown court rend la batterie disponible pour absorber les variations résiduelles et récupérer l'export avant les batteries plus lentes. Un cooldown plus long maintient la consigne plus stable. Mets 0 pour supprimer complètement ce délai. Un passage à `0` reste immédiat pour permettre un arrêt de sécurité. La batterie capable de charger au cooldown le plus court peut redémarrer depuis `0` immédiatement quand le compteur maison brut confirme un import ou export correspondant, mais en import normal elle attend si une batterie avec une meilleure marge de SoC a encore de la capacité de décharge, sauf en cas d'import fort. Elle peut absorber la consigne de charge déjà active plus l'export brut restant quand une batterie reliée à des panneaux solaires est pleine, et réduire progressivement cette consigne pendant les courts rebonds en import au lieu de retomber directement à `0`. Si cette batterie capable de charger décharge encore pendant ce trop-plein solaire, le blueprint l'arrête d'abord à `0 W`, puis la laisse charger après son retour dans la zone morte de décharge. Les batteries plus lentes attendent leur cooldown avant de redémarrer depuis `0`, tandis qu’un export brut peut toujours réduire une consigne de décharge active avant la fin du cooldown."
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 5
              unit_of_measurement: s
              mode: slider
        battery_4_target_power_entity:
          name: "Entité de consigne de puissance"
          description: "Entité `number` ou `input_number` écrite par le blueprint. La consigne est signée en watts : positive pour décharger, négative pour charger, `0` pour s'arrêter. Si la batterie doit charger, l'entité choisie doit accepter les valeurs négatives."
          default: ""
          selector:
            entity:
              filter:
                - domain: number
                - domain: input_number
        battery_4_target_power_uses_absolute_value:
          name: "L'entité de consigne utilise des valeurs absolues"
          description: "Active cette option quand l'entité de consigne attend une puissance positive en charge comme en décharge. Le blueprint garde une consigne signée en interne, écrit la valeur absolue dans cette entité et utilise les actions de charge/décharge pour choisir le sens de fonctionnement. Quand la télémétrie ne confirme pas le sens demandé, ces actions de direction sont relancées afin qu'un ancien mode charge ne bloque pas la décharge."
          default: false
          selector:
            boolean: {}
        battery_4_connected_to_solar_panels:
          name: "Reliée à des panneaux solaires"
          description: "Active cette option uniquement pour une batterie directement reliée à des panneaux solaires et susceptible de continuer à sortir leur production quand elle est pleine malgré une consigne à 0. Quand cette option est active, une décharge physique à consigne nulle n'est traitée comme production solaire forcée que si le SoC est au moins à 99 %."
          default: false
          selector:
            boolean: {}
        battery_4_actual_power_sensor:
          name: "Capteur de puissance réelle"
          description: "Capteur de puissance optionnel qui remonte la puissance réellement délivrée par la batterie en watts. L'allocateur continue d'utiliser l'entité de consigne et le compteur maison comme boucle principale. Après le délai de réponse, seule une mesure fraîche sert de garde-fou pour éviter de compter une batterie comme apport réel quand elle ne délivre plus. Une télémétrie ancienne ou périmée n'empêche pas une batterie au repos de démarrer et n'exclut pas à elle seule une batterie active des allocations de décharge additionnelles ; l'allocateur retombe sur la consigne commandée jusqu'au retour d'une mesure fraîche."
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        battery_4_discharge_actions:
          name: "Actions de décharge"
          description: "Actions personnalisées optionnelles exécutées quand cette batterie doit décharger activement, puis à nouveau quand elle devrait s'arrêter mais remonte encore une décharge physique hors heures creuses. Elles tournent à chaque mise à jour active de consigne en décharge hors heures creuses. Les variables battery_slot, battery_soc, target_power_w, target_discharge_w, target_charge_w, house_power_w, import_need_w et export_surplus_w sont disponibles dans ces actions ; les variables de consigne sont initialisées globalement puis remplacées par les valeurs du slot courant avant cette séquence."
          default: []
          selector:
            action: {}
        battery_4_charge_actions:
          name: "Actions de charge"
          description: "Actions personnalisées optionnelles exécutées quand cette batterie doit charger pour absorber un surplus exporté, puis à nouveau quand elle devrait s'arrêter mais remonte encore une charge physique. Elles tournent à chaque mise à jour active de consigne en charge hors heures creuses. Les variables battery_slot, battery_soc, target_power_w, target_discharge_w, target_charge_w, house_power_w, import_need_w et export_surplus_w sont disponibles dans ces actions ; les variables de consigne sont initialisées globalement puis remplacées par les valeurs du slot courant avant cette séquence."
          default: []
          selector:
            action: {}

mode: restart

triggers:
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: state
    entity_id: !input house_power_sensor
    not_to: null
  - trigger: state
    entity_id: !input off_peak_entities
    to: "on"
    for: "00:00:15"
  - trigger: state
    entity_id: !input off_peak_entities
    from: "on"

variables:
  house_power_sensor: !input house_power_sensor
  off_peak_entities: !input off_peak_entities
  control_deadband_w: 10
  forced_solar_output_full_soc_pct: 99
  discharge_increase_step_w: 250
  buffer_discharge_increase_step_w: 500
  strong_import_threshold_w: 800
  strong_import_discharge_increase_step_w: 1200
  strong_import_discharge_budget_share_pct: 75

  allow_confirmed_flow_start_from_zero: true
  # Buffer batteries may restart from 0 on confirmed flow immediately.
  # Stable batteries still wait for their cooldown to avoid import/export yo-yo.
  actual_power_stale_timeout_s: 300
  run_started_ts: "{{ as_timestamp(now()) }}"
  battery_slot: 0
  battery_soc: 0
  target_power_w: 0
  target_discharge_w: 0
  target_charge_w: 0

  battery_1_soc_sensor: !input battery_1_soc_sensor
  battery_1_max_discharge_w: !input battery_1_max_discharge_w
  battery_1_min_discharge_soc_pct: !input battery_1_min_discharge_soc_pct
  battery_1_max_charge_w: !input battery_1_max_charge_w
  battery_1_cooldown_seconds: !input battery_1_cooldown_seconds
  battery_1_target_power_entity: !input battery_1_target_power_entity
  battery_1_target_power_uses_absolute_value: !input battery_1_target_power_uses_absolute_value
  battery_1_connected_to_solar_panels: !input battery_1_connected_to_solar_panels
  battery_1_actual_power_sensor: !input battery_1_actual_power_sensor
  battery_1_discharge_actions: !input battery_1_discharge_actions
  battery_1_charge_actions: !input battery_1_charge_actions
  
  battery_2_soc_sensor: !input battery_2_soc_sensor
  battery_2_max_discharge_w: !input battery_2_max_discharge_w
  battery_2_min_discharge_soc_pct: !input battery_2_min_discharge_soc_pct
  battery_2_max_charge_w: !input battery_2_max_charge_w
  battery_2_cooldown_seconds: !input battery_2_cooldown_seconds
  battery_2_target_power_entity: !input battery_2_target_power_entity
  battery_2_target_power_uses_absolute_value: !input battery_2_target_power_uses_absolute_value
  battery_2_connected_to_solar_panels: !input battery_2_connected_to_solar_panels
  battery_2_actual_power_sensor: !input battery_2_actual_power_sensor
  battery_2_discharge_actions: !input battery_2_discharge_actions
  battery_2_charge_actions: !input battery_2_charge_actions
  
  battery_3_soc_sensor: !input battery_3_soc_sensor
  battery_3_max_discharge_w: !input battery_3_max_discharge_w
  battery_3_min_discharge_soc_pct: !input battery_3_min_discharge_soc_pct
