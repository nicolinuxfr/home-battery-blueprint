  emergency_charge_active: "{{ emergency_charge_surplus_w | float(0) >= opportunistic_charge_threshold_w | float(0) }}"
  charge_targets: >-
    {% set batteries = emergency_charge_order if emergency_charge_active | bool else charge_order %}
    {% set charge_need = emergency_charge_surplus_w | float(0) if emergency_charge_active | bool else export_surplus_w | float(0) %}
    {% set ns = namespace(remaining=[(charge_need | float(0)) - (uncommanded_actual_charge_w | float(0)), 0] | max, t1=0, t2=0, t3=0, t4=0) %}
    {% if operating_mode == 'charge' or emergency_charge_active | bool %}
      {% for battery in batteries %}
        {% set battery_discharge_target = 0 %}
        {% if battery.slot == 1 %}
          {% set battery_discharge_target = discharge_targets['1'] | float(0) %}
        {% elif battery.slot == 2 %}
          {% set battery_discharge_target = discharge_targets['2'] | float(0) %}
        {% elif battery.slot == 3 %}
          {% set battery_discharge_target = discharge_targets['3'] | float(0) %}
        {% elif battery.slot == 4 %}
          {% set battery_discharge_target = discharge_targets['4'] | float(0) %}
        {% endif %}
        {% if battery.charge_locked
              and (operating_mode == 'charge' or battery_discharge_target < control_deadband_w | float(0)) %}
          {% set allocation = [battery.current_charge, battery.max_charge] | min %}
          {% set allocation = [allocation, 0] | max %}
          {% if battery.slot == 1 %}
            {% set ns.t1 = allocation | round(0) %}
          {% elif battery.slot == 2 %}
            {% set ns.t2 = allocation | round(0) %}
          {% elif battery.slot == 3 %}
            {% set ns.t3 = allocation | round(0) %}
          {% elif battery.slot == 4 %}
            {% set ns.t4 = allocation | round(0) %}
          {% endif %}
          {% set ns.remaining = [ns.remaining - allocation, 0] | max %}
        {% endif %}
      {% endfor %}
      {% for battery in batteries %}
        {% set battery_discharge_target = 0 %}
        {% if battery.slot == 1 %}
          {% set battery_discharge_target = discharge_targets['1'] | float(0) %}
        {% elif battery.slot == 2 %}
          {% set battery_discharge_target = discharge_targets['2'] | float(0) %}
        {% elif battery.slot == 3 %}
          {% set battery_discharge_target = discharge_targets['3'] | float(0) %}
        {% elif battery.slot == 4 %}
          {% set battery_discharge_target = discharge_targets['4'] | float(0) %}
        {% endif %}
        {% if ns.remaining > 0
              and not battery.charge_locked
              and (
                not battery.discharge_locked
                or (
                  charge_buffer_cooldown_s | float(-1) >= 0
                  and battery.cooldown_s | float(0) == charge_buffer_cooldown_s | float(-1)
                )
              )
              and (
                   (operating_mode == 'charge'
                    and full_solar_absorb_export_w | float(0) <= 0)
                   or (
                     battery_discharge_target < control_deadband_w | float(0)
                     and battery.current_discharge | float(0) < control_deadband_w | float(0)
                   )
              ) %}
          {% set allocation = [battery.max_charge, ns.remaining] | min %}
          {% set allocation = [allocation, 0] | max %}
          {% if battery.slot == 1 %}
            {% set ns.t1 = allocation | round(0) %}
          {% elif battery.slot == 2 %}
            {% set ns.t2 = allocation | round(0) %}
          {% elif battery.slot == 3 %}
            {% set ns.t3 = allocation | round(0) %}
          {% elif battery.slot == 4 %}
            {% set ns.t4 = allocation | round(0) %}
          {% endif %}
          {% set ns.remaining = [ns.remaining - allocation, 0] | max %}
        {% endif %}
      {% endfor %}
    {% elif operating_mode == 'charge_hold' %}
      {% for battery in batteries %}
        {% set allocation = battery.current_charge | float(0) %}
        {% if battery.slot == 1 %}
          {% set ns.t1 = allocation | round(0) %}
        {% elif battery.slot == 2 %}
          {% set ns.t2 = allocation | round(0) %}
        {% elif battery.slot == 3 %}
          {% set ns.t3 = allocation | round(0) %}
        {% elif battery.slot == 4 %}
          {% set ns.t4 = allocation | round(0) %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ {'1': ns.t1, '2': ns.t2, '3': ns.t3, '4': ns.t4} }}
  neutral_targets: >-
    {% set ns = namespace(t1=0, t2=0, t3=0, t4=0) %}
    {% if operating_mode == 'neutral' %}
      {% for battery in batteries %}
        {% set hold_power = battery.current_target | float(0) %}
        {% set hold_power = [hold_power, battery.max_discharge | float(0)] | min %}
        {% set hold_power = [hold_power, 0 - (battery.max_charge | float(0))] | max %}
        {% if battery.slot == 1 %}
          {% set ns.t1 = hold_power | round(0) %}
        {% elif battery.slot == 2 %}
          {% set ns.t2 = hold_power | round(0) %}
        {% elif battery.slot == 3 %}
          {% set ns.t3 = hold_power | round(0) %}
        {% elif battery.slot == 4 %}
          {% set ns.t4 = hold_power | round(0) %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ {'1': ns.t1, '2': ns.t2, '3': ns.t3, '4': ns.t4} }}
  discharge_trimmed_locked_w: "{{ discharge_plan['trimmed_locked_w'] | float(0) }}"

  discharge_target_1: "{{ discharge_targets['1'] | float(0) }}"
  discharge_target_2: "{{ discharge_targets['2'] | float(0) }}"
  discharge_target_3: "{{ discharge_targets['3'] | float(0) }}"
  discharge_target_4: "{{ discharge_targets['4'] | float(0) }}"

  charge_target_1: "{{ charge_targets['1'] | float(0) }}"
  charge_target_2: "{{ charge_targets['2'] | float(0) }}"
  charge_target_3: "{{ charge_targets['3'] | float(0) }}"
  charge_target_4: "{{ charge_targets['4'] | float(0) }}"
  neutral_target_1: "{{ neutral_targets['1'] | float(0) }}"
  neutral_target_2: "{{ neutral_targets['2'] | float(0) }}"
  neutral_target_3: "{{ neutral_targets['3'] | float(0) }}"
  neutral_target_4: "{{ neutral_targets['4'] | float(0) }}"

  locked_discharge_reduction_pending: >-
    {{
      (
        slot_1_current_target_w | float(0) > 0
        and discharge_target_1 | float(0) >= control_deadband_w | float(0)
        and discharge_target_1 | float(0) < slot_1_current_target_w | float(0) - control_deadband_w | float(0)
        and not (discharge_cooldown_ok_1 | bool)
      )
      or (
        slot_2_current_target_w | float(0) > 0
        and discharge_target_2 | float(0) >= control_deadband_w | float(0)
        and discharge_target_2 | float(0) < slot_2_current_target_w | float(0) - control_deadband_w | float(0)
        and not (discharge_cooldown_ok_2 | bool)
      )
      or (
        slot_3_current_target_w | float(0) > 0
        and discharge_target_3 | float(0) >= control_deadband_w | float(0)
        and discharge_target_3 | float(0) < slot_3_current_target_w | float(0) - control_deadband_w | float(0)
        and not (discharge_cooldown_ok_3 | bool)
      )
      or (
        slot_4_current_target_w | float(0) > 0
        and discharge_target_4 | float(0) >= control_deadband_w | float(0)
        and discharge_target_4 | float(0) < slot_4_current_target_w | float(0) - control_deadband_w | float(0)
        and not (discharge_cooldown_ok_4 | bool)
      )
    }}

  zero_target_actual_discharge_w: >-
    {{
      (slot_1_actual_discharge_w | float(0) if slot_1_used | bool and slot_1_actual_power_usable | bool and slot_1_current_target_w | float(0) <= control_deadband_w | float(0) and slot_1_actual_discharge_w | float(0) > control_deadband_w | float(0) else 0)
      + (slot_2_actual_discharge_w | float(0) if slot_2_used | bool and slot_2_actual_power_usable | bool and slot_2_current_target_w | float(0) <= control_deadband_w | float(0) and slot_2_actual_discharge_w | float(0) > control_deadband_w | float(0) else 0)
      + (slot_3_actual_discharge_w | float(0) if slot_3_used | bool and slot_3_actual_power_usable | bool and slot_3_current_target_w | float(0) <= control_deadband_w | float(0) and slot_3_actual_discharge_w | float(0) > control_deadband_w | float(0) else 0)
      + (slot_4_actual_discharge_w | float(0) if slot_4_used | bool and slot_4_actual_power_usable | bool and slot_4_current_target_w | float(0) <= control_deadband_w | float(0) and slot_4_actual_discharge_w | float(0) > control_deadband_w | float(0) else 0)
    }}
  zero_target_actual_charge_w: >-
    {{
      (slot_1_actual_charge_w | float(0) if slot_1_used | bool and slot_1_actual_power_usable | bool and slot_1_current_target_w | float(0) >= 0 - (control_deadband_w | float(0)) and slot_1_actual_charge_w | float(0) > control_deadband_w | float(0) else 0)
      + (slot_2_actual_charge_w | float(0) if slot_2_used | bool and slot_2_actual_power_usable | bool and slot_2_current_target_w | float(0) >= 0 - (control_deadband_w | float(0)) and slot_2_actual_charge_w | float(0) > control_deadband_w | float(0) else 0)
      + (slot_3_actual_charge_w | float(0) if slot_3_used | bool and slot_3_actual_power_usable | bool and slot_3_current_target_w | float(0) >= 0 - (control_deadband_w | float(0)) and slot_3_actual_charge_w | float(0) > control_deadband_w | float(0) else 0)
      + (slot_4_actual_charge_w | float(0) if slot_4_used | bool and slot_4_actual_power_usable | bool and slot_4_current_target_w | float(0) >= 0 - (control_deadband_w | float(0)) and slot_4_actual_charge_w | float(0) > control_deadband_w | float(0) else 0)
    }}
  planned_discharge_total_w: >-
    {{
      (discharge_target_1 | float(0))
      + (discharge_target_2 | float(0))
      + (discharge_target_3 | float(0))
      + (discharge_target_4 | float(0))
    }}
  planned_charge_total_w: >-
    {{
      (charge_target_1 | float(0))
      + (charge_target_2 | float(0))
      + (charge_target_3 | float(0))
      + (charge_target_4 | float(0))
    }}
  corrected_import_need_w: "{{ [import_need_w | float(0) - zero_target_actual_discharge_w | float(0), 0] | max }}"
  corrected_export_surplus_w: "{{ [export_surplus_w | float(0) - zero_target_actual_charge_w | float(0), 0] | max }}"
  possible_duplicate_discharge_w: >-
    {% if zero_target_actual_discharge_w | float(0) > control_deadband_w | float(0) %}
      {{ [planned_discharge_total_w | float(0) - corrected_import_need_w | float(0), 0] | max }}
    {% else %}
      0
    {% endif %}
  possible_duplicate_charge_w: >-
    {% if zero_target_actual_charge_w | float(0) > control_deadband_w | float(0) %}
      {{ [planned_charge_total_w | float(0) - corrected_export_surplus_w | float(0), 0] | max }}
    {% else %}
      0
    {% endif %}

  # Generated command guards let the charge buffer increase its charge target
  # immediately only when full solar-connected batteries force output.
  discharge_buffer_1: >-
    {{ slot_1_can_discharge | bool
       and not (slot_1_discharge_delivery_stalled | bool)
       and discharge_buffer_cooldown_s | float(-1) >= 0
       and battery_1_cooldown_seconds | float(0) == discharge_buffer_cooldown_s | float(-1) }}
  charge_buffer_1: >-
    {{ slot_1_can_charge | bool
       and charge_buffer_cooldown_s | float(-1) >= 0
       and battery_1_cooldown_seconds | float(0) == charge_buffer_cooldown_s | float(-1) }}
  discharge_active_1: "{{ operating_mode in ['discharge', 'discharge_hold'] and discharge_target_1 >= control_deadband_w | float(0) }}"
  charge_active_1: "{{ (operating_mode in ['charge', 'charge_hold'] or emergency_charge_active | bool) and charge_target_1 >= control_deadband_w | float(0) }}"
  neutral_hold_active_1: "{{ operating_mode == 'neutral' and neutral_target_1 | abs >= control_deadband_w | float(0) }}"
  full_solar_charge_stop_required_1: >-
    {{ full_solar_absorb_export_w | float(0) > 0
       and slot_1_can_charge | bool
       and (
         slot_1_current_target_w | float(0) > control_deadband_w | float(0)
         or (
           slot_1_actual_power_usable | bool
           and slot_1_actual_discharge_w | float(0) > control_deadband_w | float(0)
         )
       ) }}
  signed_target_1: >-
    {% if full_solar_charge_stop_required_1 | bool %}
      0
    {% elif discharge_active_1 %}
      {{ discharge_target_1 | float(0) }}
    {% elif charge_active_1 %}
      {{ 0 - (charge_target_1 | float(0)) }}
    {% elif neutral_hold_active_1 %}
      {{ neutral_target_1 | float(0) }}
    {% else %}
      0
    {% endif %}
  desired_target_sign_1: >-
    {% if signed_target_1 | float(0) > 0 %}
      1
    {% elif signed_target_1 | float(0) < 0 %}
      -1
    {% else %}
      0
    {% endif %}
  responsive_target_allowed_1: >-
    {{ (
         desired_target_sign_1 | int(0) == 1
         and discharge_buffer_1 | bool
       )
       or (
         desired_target_sign_1 | int(0) == -1
         and charge_buffer_1 | bool
       ) }}
  current_target_for_control_1: >-
    {% set current = slot_1_current_target_w | float(0) %}
    {% if battery_1_target_power_uses_absolute_value | bool
          and desired_target_sign_1 | int(0) == -1
          and current > 0 %}
      {{ 0 - current }}
    {% else %}
      {{ current }}
    {% endif %}
  current_target_sign_for_control_1: >-
    {% if current_target_for_control_1 | float(0) > 0 %}
      1
    {% elif current_target_for_control_1 | float(0) < 0 %}
      -1
    {% else %}
      0
    {% endif %}
  current_target_rounded_1: "{{ current_target_for_control_1 | float(0) | round(0) | int(0) }}"
  desired_target_rounded_1: "{{ signed_target_1 | float(0) | round(0) | int(0) }}"
  target_value_changed_1: "{{ desired_target_rounded_1 | int(0) != current_target_rounded_1 | int(0) }}"
  same_direction_target_delta_w_1: "{{ (desired_target_rounded_1 | int(0) - current_target_rounded_1 | int(0)) | abs }}"
  same_direction_small_adjustment_1: >-
    {{ target_value_changed_1 | bool
       and desired_target_sign_1 | int(0) != 0
       and desired_target_sign_1 | int(0) == current_target_sign_for_control_1 | int(0)
       and discharge_rebalance_delta_1 | float(0) == 0
       and same_direction_target_delta_w_1 | float(0) < control_deadband_w | float(0) }}
  direction_action_retry_interval_s_1: "{{ [60, battery_1_cooldown_seconds | float(0) * 3] | max }}"
  absolute_direction_action_retry_due_1: >-
    {% set retry_interval = direction_action_retry_interval_s_1 | float(60) %}
    {{ slot_1_target_age_s | float(0) >= retry_interval
       and ((slot_1_target_age_s | float(0)) % retry_interval) < 60 }}
  discharge_direction_confirmed_1: >-
    {{ slot_1_actual_power_usable | bool
       and slot_1_actual_discharge_w | float(0) > control_deadband_w | float(0) }}
  charge_direction_confirmed_1: >-
    {{ slot_1_actual_power_usable | bool
       and slot_1_actual_charge_w | float(0) > control_deadband_w | float(0) }}
  absolute_discharge_action_guard_due_1: >-
    {{ battery_1_target_power_uses_absolute_value | bool
       and slot_1_has_discharge_actions | bool
       and signed_target_1 | float(0) > 0
       and not (target_value_changed_1 | bool)
       and not (discharge_direction_confirmed_1 | bool)
       and (
         slot_1_target_age_s | float(0) < slot_1_response_grace_s | float(0)
         or absolute_direction_action_retry_due_1 | bool
       ) }}
  absolute_charge_action_guard_due_1: >-
    {{ battery_1_target_power_uses_absolute_value | bool
       and slot_1_has_charge_actions | bool
       and signed_target_1 | float(0) < 0
       and not (target_value_changed_1 | bool)
       and not (charge_direction_confirmed_1 | bool)
       and (
         slot_1_target_age_s | float(0) < slot_1_response_grace_s | float(0)
         or absolute_direction_action_retry_due_1 | bool
       ) }}
  direction_change_blocked_by_cooldown_1: >-
    {{ desired_target_sign_1 | int(0) != 0
       and current_target_sign_for_control_1 | int(0) != 0
       and desired_target_sign_1 | int(0) != current_target_sign_for_control_1 | int(0)
       and not (triggered_by_off_peak_entity | bool)
       and slot_1_target_age_s | float(0) < slot_1_response_grace_s | float(0) }}
  start_from_zero_flow_confirmed_1: >-
    {{ current_target_sign_for_control_1 | int(0) == 0
       and allow_confirmed_flow_start_from_zero | bool
       and (
         (desired_target_sign_1 | int(0) == 1
          and house_power_valid
          and house_power_w | float(0) >= control_deadband_w | float(0)
          and (
            discharge_buffer_1 | bool
            or discharge_cooldown_ok_1 | bool
          ))
         or
         (desired_target_sign_1 | int(0) == -1
          and house_power_valid
          and house_power_w | float(0) <= 0 - (control_deadband_w | float(0))
          and (
            charge_buffer_1 | bool
            or charge_cooldown_ok_1 | bool
          ))
       ) }}
  discharge_increase_blocked_by_locked_reduction_1: >-
    {{ locked_discharge_reduction_pending | bool
       and signed_target_1 | float(0) > slot_1_current_target_w | float(0)
       and signed_target_1 | float(0) > 0
       and (signed_target_1 | float(0) - slot_1_current_target_w | float(0)) > [house_power_w | float(0), 0] | max
       and not (discharge_export_guard_active | bool) }}
  should_write_target_power_1: >-
    {% if not slot_1_target_entity_configured %}
      false
    {% elif desired_target_sign_1 | int(0) == 0 %}
      {{ current_target_sign_for_control_1 | int(0) != 0 }}
    {% elif direction_change_blocked_by_cooldown_1 | bool %}
      false
    {% elif desired_target_sign_1 | int(0) != current_target_sign_for_control_1 | int(0)
          and current_target_sign_for_control_1 | int(0) != 0 %}
      true
    {% elif not (target_value_changed_1 | bool) %}
      false
    {% elif same_direction_small_adjustment_1 | bool %}
      false
    {% elif discharge_increase_blocked_by_locked_reduction_1 | bool %}
      false
    {% elif start_from_zero_flow_confirmed_1 | bool %}
      true
    {% elif signed_target_1 | float(0) > 0 %}
      {{ discharge_cooldown_ok_1
         or (discharge_export_guard_active
             and slot_1_current_target_w | float(0) > 0
             and signed_target_1 | float(0) < slot_1_current_target_w | float(0)) }}
    {% elif signed_target_1 | float(0) < 0 %}
      {{ charge_cooldown_ok_1
         or (
           responsive_target_allowed_1 | bool
           and forced_solar_output_active | bool
           and signed_target_1 | float(0) < current_target_for_control_1 | float(0)
         )
         }}
    {% else %}
      false
    {% endif %}
  should_run_discharge_actions_1: >-
    {% if not slot_1_has_discharge_actions %}
      false
    {% elif direction_change_blocked_by_cooldown_1 | bool %}
      false
    {% elif signed_target_1 | float(0) <= 0 %}
      {{ (
           current_target_sign_for_control_1 | int(0) == 1
           and target_value_changed_1 | bool
         ) or (
           slot_1_actual_power_usable | bool
           and slot_1_actual_discharge_w | float(0) > control_deadband_w | float(0)
           and (
             discharge_cooldown_ok_1 | bool
             or full_solar_charge_stop_required_1 | bool
           )
         ) }}
    {% elif discharge_increase_blocked_by_locked_reduction_1 | bool %}
      false
    {% elif current_target_sign_for_control_1 | int(0) != 1 %}
      {{ start_from_zero_flow_confirmed_1 | bool
         or (responsive_target_allowed_1 | bool and signed_target_1 | float(0) > 0)
         or current_target_sign_for_control_1 | int(0) != 0 }}
    {% elif absolute_discharge_action_guard_due_1 | bool %}
      true
    {% elif not (target_value_changed_1 | bool) %}
      false
    {% elif same_direction_small_adjustment_1 | bool %}
      false
    {% else %}
      {{ discharge_cooldown_ok_1
         or (discharge_export_guard_active
             and slot_1_current_target_w | float(0) > 0
             and signed_target_1 | float(0) < slot_1_current_target_w | float(0)) }}
    {% endif %}
  should_run_charge_actions_1: >-
    {% if not slot_1_has_charge_actions %}
      false
    {% elif direction_change_blocked_by_cooldown_1 | bool %}
      false
    {% elif signed_target_1 | float(0) >= 0 %}
      {{ (
           current_target_sign_for_control_1 | int(0) == -1
           and target_value_changed_1 | bool
         ) or (
           slot_1_actual_power_usable | bool
           and slot_1_actual_charge_w | float(0) > control_deadband_w | float(0)
           and charge_cooldown_ok_1 | bool
         ) }}
    {% elif current_target_sign_for_control_1 | int(0) != -1 %}
      {{ start_from_zero_flow_confirmed_1 | bool
         or (responsive_target_allowed_1 | bool and signed_target_1 | float(0) < 0)
         or current_target_sign_for_control_1 | int(0) != 0 }}
    {% elif absolute_charge_action_guard_due_1 | bool %}
      true
    {% elif not (target_value_changed_1 | bool) %}
      false
    {% elif same_direction_small_adjustment_1 | bool %}
      false
    {% else %}
      {{ charge_cooldown_ok_1
         or (
           responsive_target_allowed_1 | bool
           and forced_solar_output_active | bool
           and signed_target_1 | float(0) < current_target_for_control_1 | float(0)
         ) }}
    {% endif %}
  
  discharge_buffer_2: >-
    {{ slot_2_can_discharge | bool
       and not (slot_2_discharge_delivery_stalled | bool)
       and discharge_buffer_cooldown_s | float(-1) >= 0
       and battery_2_cooldown_seconds | float(0) == discharge_buffer_cooldown_s | float(-1) }}
  charge_buffer_2: >-
    {{ slot_2_can_charge | bool
       and charge_buffer_cooldown_s | float(-1) >= 0
       and battery_2_cooldown_seconds | float(0) == charge_buffer_cooldown_s | float(-1) }}
  discharge_active_2: "{{ operating_mode in ['discharge', 'discharge_hold'] and discharge_target_2 >= control_deadband_w | float(0) }}"
  charge_active_2: "{{ (operating_mode in ['charge', 'charge_hold'] or emergency_charge_active | bool) and charge_target_2 >= control_deadband_w | float(0) }}"
  neutral_hold_active_2: "{{ operating_mode == 'neutral' and neutral_target_2 | abs >= control_deadband_w | float(0) }}"
  full_solar_charge_stop_required_2: >-
    {{ full_solar_absorb_export_w | float(0) > 0
       and slot_2_can_charge | bool
       and (
         slot_2_current_target_w | float(0) > control_deadband_w | float(0)
         or (
           slot_2_actual_power_usable | bool
           and slot_2_actual_discharge_w | float(0) > control_deadband_w | float(0)
         )
       ) }}
  signed_target_2: >-
    {% if full_solar_charge_stop_required_2 | bool %}
      0
    {% elif discharge_active_2 %}
      {{ discharge_target_2 | float(0) }}
    {% elif charge_active_2 %}
      {{ 0 - (charge_target_2 | float(0)) }}
