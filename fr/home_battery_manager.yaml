    {% elif not (slot_1_actual_power_fresh | bool) %}
      false
    {% elif slot_1_actual_power_stale | bool %}
      false
    {% elif slot_1_actual_power_usable | bool %}
      {{ actual_discharge <= 50 and (current_target - actual_discharge) > 50 }}
    {% else %}
      false
    {% endif %}
  slot_1_can_discharge: >-
    {{ slot_1_used
       and slot_1_target_entity_configured
       and battery_1_max_discharge_w | float(0) > 0
       and slot_1_soc | float(0) >= battery_1_min_discharge_soc_pct | float(0) }}
  slot_1_can_charge: "{{ slot_1_used and slot_1_target_entity_configured and battery_1_max_charge_w | float(0) > 0 }}"
  
