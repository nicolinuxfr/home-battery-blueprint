          Batterie 3 a une entité de consigne configurée, mais ses deux limites de puissance sont à 0 W. Renseigne une puissance maximale de décharge ou de charge non nulle pour rendre ce slot utilisable.
        {%- endset %}
        {% set ns.errors = ns.errors + [error_text | trim] %}
      {% endif %}
    {% endif %}
    
    {% if slot_4_used %}
      {% set has_target_entity = slot_4_target_entity_configured | bool %}
      {% set discharge_power_enabled = battery_4_max_discharge_w | float(0) > 0 %}
      {% set charge_power_enabled = battery_4_max_charge_w | float(0) > 0 %}
      {% if not has_target_entity %}
        {% set error_text -%}
          Batterie 4 est activée par son capteur de charge, mais aucune entité de consigne de puissance n'est configurée. Ajoute une entité `number` ou `input_number`, ou vide le capteur d'état de charge pour désactiver ce slot batterie.
        {%- endset %}
        {% set ns.errors = ns.errors + [error_text | trim] %}
      {% elif not (discharge_power_enabled or charge_power_enabled) %}
        {% set error_text -%}
          Batterie 4 a une entité de consigne configurée, mais ses deux limites de puissance sont à 0 W. Renseigne une puissance maximale de décharge ou de charge non nulle pour rendre ce slot utilisable.
        {%- endset %}
        {% set ns.errors = ns.errors + [error_text | trim] %}
      {% endif %}
    {% endif %}
    {{ ns.errors }}

  # Cooldown state must be available before building the battery list so
  # allocation can reserve locked output and redistribute only the remainder.
  # The generated battery list also keeps a slot out of new discharge allocation
  # while fresh actual-power telemetry confirms it is still physically charging.
  slot_1_cooldown_elapsed: >-
    {% if battery_1_cooldown_seconds | float(0) <= 0 %}
      true
    {% elif slot_1_target_last_changed_ts | float(0) <= 0 %}
