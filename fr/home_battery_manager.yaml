       and desired_target_sign_4 | int(0) == current_target_sign_for_control_4 | int(0)
       and discharge_rebalance_delta_4 | float(0) == 0
       and same_direction_target_delta_w_4 | float(0) < control_deadband_w | float(0) }}
  direction_action_retry_interval_s_4: "{{ [60, battery_4_cooldown_seconds | float(0) * 3] | max }}"
  absolute_direction_action_retry_due_4: >-
    {% set retry_interval = direction_action_retry_interval_s_4 | float(60) %}
    {{ slot_4_target_age_s | float(0) >= retry_interval
       and ((slot_4_target_age_s | float(0)) % retry_interval) < 60 }}
  discharge_direction_confirmed_4: >-
    {{ slot_4_actual_power_usable | bool
       and slot_4_actual_discharge_w | float(0) > control_deadband_w | float(0) }}
  charge_direction_confirmed_4: >-
    {{ slot_4_actual_power_usable | bool
       and slot_4_actual_charge_w | float(0) > control_deadband_w | float(0) }}
  absolute_discharge_action_guard_due_4: >-
    {{ battery_4_target_power_uses_absolute_value | bool
       and slot_4_has_discharge_actions | bool
       and signed_target_4 | float(0) > 0
       and not (target_value_changed_4 | bool)
       and not (discharge_direction_confirmed_4 | bool)
       and (
         slot_4_target_age_s | float(0) < slot_4_response_grace_s | float(0)
         or absolute_direction_action_retry_due_4 | bool
       ) }}
  absolute_charge_action_guard_due_4: >-
    {{ battery_4_target_power_uses_absolute_value | bool
       and slot_4_has_charge_actions | bool
       and signed_target_4 | float(0) < 0
       and not (target_value_changed_4 | bool)
       and not (charge_direction_confirmed_4 | bool)
       and (
         slot_4_target_age_s | float(0) < slot_4_response_grace_s | float(0)
         or absolute_direction_action_retry_due_4 | bool
       ) }}
  direction_change_blocked_by_cooldown_4: >-
    {{ desired_target_sign_4 | int(0) != 0
       and current_target_sign_for_control_4 | int(0) != 0
       and desired_target_sign_4 | int(0) != current_target_sign_for_control_4 | int(0)
       and not (triggered_by_off_peak_entity | bool)
       and slot_4_target_age_s | float(0) < slot_4_response_grace_s | float(0) }}
  start_from_zero_flow_confirmed_4: >-
    {{ current_target_sign_for_control_4 | int(0) == 0
       and allow_confirmed_flow_start_from_zero | bool
       and (
         (desired_target_sign_4 | int(0) == 1
          and house_power_valid
          and house_power_w | float(0) >= control_deadband_w | float(0)
          and (
            discharge_buffer_4 | bool
            or discharge_cooldown_ok_4 | bool
          ))
         or
         (desired_target_sign_4 | int(0) == -1
          and house_power_valid
          and house_power_w | float(0) <= 0 - (control_deadband_w | float(0))
          and (
            charge_buffer_4 | bool
            or charge_cooldown_ok_4 | bool
          ))
       ) }}
  discharge_increase_blocked_by_locked_reduction_4: >-
    {{ locked_discharge_reduction_pending | bool
       and signed_target_4 | float(0) > slot_4_current_target_w | float(0)
       and signed_target_4 | float(0) > 0
       and (signed_target_4 | float(0) - slot_4_current_target_w | float(0)) > [house_power_w | float(0), 0] | max
       and not (discharge_export_guard_active | bool) }}
  should_write_target_power_4: >-
    {% if not slot_4_target_entity_configured %}
      false
    {% elif desired_target_sign_4 | int(0) == 0 %}
      {{ current_target_sign_for_control_4 | int(0) != 0 }}
    {% elif direction_change_blocked_by_cooldown_4 | bool %}
      false
    {% elif desired_target_sign_4 | int(0) != current_target_sign_for_control_4 | int(0)
          and current_target_sign_for_control_4 | int(0) != 0 %}
      true
    {% elif not (target_value_changed_4 | bool) %}
      false
    {% elif same_direction_small_adjustment_4 | bool %}
      false
    {% elif discharge_increase_blocked_by_locked_reduction_4 | bool %}
      false
    {% elif start_from_zero_flow_confirmed_4 | bool %}
      true
    {% elif signed_target_4 | float(0) > 0 %}
      {{ discharge_cooldown_ok_4
         or (discharge_export_guard_active
             and slot_4_current_target_w | float(0) > 0
             and signed_target_4 | float(0) < slot_4_current_target_w | float(0)) }}
    {% elif signed_target_4 | float(0) < 0 %}
      {{ charge_cooldown_ok_4
         or (
           responsive_target_allowed_4 | bool
           and forced_solar_output_active | bool
           and signed_target_4 | float(0) < current_target_for_control_4 | float(0)
         )
         }}
    {% else %}
      false
    {% endif %}
  should_run_discharge_actions_4: >-
    {% if not slot_4_has_discharge_actions %}
      false
    {% elif direction_change_blocked_by_cooldown_4 | bool %}
      false
    {% elif signed_target_4 | float(0) <= 0 %}
      {{ (
           current_target_sign_for_control_4 | int(0) == 1
           and target_value_changed_4 | bool
         ) or (
           slot_4_actual_power_usable | bool
           and slot_4_actual_discharge_w | float(0) > control_deadband_w | float(0)
           and (
             discharge_cooldown_ok_4 | bool
             or full_solar_charge_stop_required_4 | bool
           )
         ) }}
    {% elif discharge_increase_blocked_by_locked_reduction_4 | bool %}
      false
    {% elif current_target_sign_for_control_4 | int(0) != 1 %}
      {{ start_from_zero_flow_confirmed_4 | bool
         or (responsive_target_allowed_4 | bool and signed_target_4 | float(0) > 0)
         or current_target_sign_for_control_4 | int(0) != 0 }}
    {% elif absolute_discharge_action_guard_due_4 | bool %}
      true
    {% elif not (target_value_changed_4 | bool) %}
      false
    {% elif same_direction_small_adjustment_4 | bool %}
      false
    {% else %}
      {{ discharge_cooldown_ok_4
         or (discharge_export_guard_active
             and slot_4_current_target_w | float(0) > 0
             and signed_target_4 | float(0) < slot_4_current_target_w | float(0)) }}
    {% endif %}
  should_run_charge_actions_4: >-
    {% if not slot_4_has_charge_actions %}
      false
    {% elif direction_change_blocked_by_cooldown_4 | bool %}
      false
    {% elif signed_target_4 | float(0) >= 0 %}
      {{ (
           current_target_sign_for_control_4 | int(0) == -1
           and target_value_changed_4 | bool
         ) or (
           slot_4_actual_power_usable | bool
           and slot_4_actual_charge_w | float(0) > control_deadband_w | float(0)
           and charge_cooldown_ok_4 | bool
         ) }}
    {% elif current_target_sign_for_control_4 | int(0) != -1 %}
      {{ start_from_zero_flow_confirmed_4 | bool
         or (responsive_target_allowed_4 | bool and signed_target_4 | float(0) < 0)
         or current_target_sign_for_control_4 | int(0) != 0 }}
    {% elif absolute_charge_action_guard_due_4 | bool %}
      true
    {% elif not (target_value_changed_4 | bool) %}
      false
    {% elif same_direction_small_adjustment_4 | bool %}
      false
    {% else %}
      {{ charge_cooldown_ok_4
         or (
           responsive_target_allowed_4 | bool
           and forced_solar_output_active | bool
           and signed_target_4 | float(0) < current_target_for_control_4 | float(0)
         ) }}
    {% endif %}
  pending_slot_target_updates: >-
    {{
      (should_write_target_power_1 | bool)
      or (should_write_target_power_2 | bool)
      or (should_write_target_power_3 | bool)
      or (should_write_target_power_4 | bool)
    }}
  pending_slot_actions: >-
    {{
      (should_run_discharge_actions_1 | bool)
      or (should_run_discharge_actions_2 | bool)
      or (should_run_discharge_actions_3 | bool)
      or (should_run_discharge_actions_4 | bool)
      or (should_run_charge_actions_1 | bool)
      or (should_run_charge_actions_2 | bool)
      or (should_run_charge_actions_3 | bool)
      or (should_run_charge_actions_4 | bool)
    }}
  should_stop_small_house_power_delta: >-
    {{
      (should_skip_small_house_power_delta | bool)
      and not (off_peak_active | bool)
      and not (pending_slot_target_updates | bool)
      and not (pending_slot_actions | bool)
    }}
  run_log_reason: >-
    {% if should_stop_small_house_power_delta %}
      small_delta_skipped
    {% elif operating_mode == 'invalid_sensor' %}
      invalid_sensor
    {% else %}
      {{ operating_mode }}
    {% endif %}
  run_log_slots_json: >-
