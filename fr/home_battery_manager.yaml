    {% else %}
      {{ slot_1_effective_balance_power | float(0) }}
    {% endif %}
  slot_1_has_discharge_actions: "{{ battery_1_discharge_actions | count > 0 }}"
  slot_1_has_charge_actions: "{{ battery_1_charge_actions | count > 0 }}"
  slot_1_discharge_delivery_stalled: >-
    {% set current_target = slot_1_current_target_w | float(0) %}
    {% set actual_discharge = slot_1_actual_discharge_w | float(0) %}
    {% if current_target <= 0
          or slot_1_target_age_s | float(0) < slot_1_response_grace_s | float(0) %}
