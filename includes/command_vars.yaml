discharge_buffer___SLOT__: >-
  {{ slot___SLOT___can_discharge | bool
     and not (slot___SLOT___discharge_delivery_stalled | bool)
     and discharge_buffer_cooldown_s | float(-1) >= 0
     and battery___SLOT___cooldown_seconds | float(0) == discharge_buffer_cooldown_s | float(-1) }}
charge_buffer___SLOT__: >-
  {{ slot___SLOT___can_charge | bool
     and charge_buffer_cooldown_s | float(-1) >= 0
     and battery___SLOT___cooldown_seconds | float(0) == charge_buffer_cooldown_s | float(-1) }}
discharge_active___SLOT__: "{{ operating_mode in ['discharge', 'discharge_hold'] and discharge_target___SLOT__ >= control_deadband_w | float(0) }}"
charge_active___SLOT__: "{{ (operating_mode in ['charge', 'charge_hold'] or emergency_charge_active | bool) and charge_target___SLOT__ >= control_deadband_w | float(0) }}"
neutral_hold_active___SLOT__: "{{ operating_mode == 'neutral' and neutral_target___SLOT__ | abs >= control_deadband_w | float(0) }}"
full_solar_charge_stop_required___SLOT__: >-
  {{ full_solar_absorb_export_w | float(0) > 0
     and slot___SLOT___can_charge | bool
     and (
       slot___SLOT___current_target_w | float(0) > control_deadband_w | float(0)
       or (
         slot___SLOT___actual_power_usable | bool
         and slot___SLOT___actual_discharge_w | float(0) > control_deadband_w | float(0)
       )
     ) }}
signed_target___SLOT__: >-
  {% if full_solar_charge_stop_required___SLOT__ | bool %}
    0
  {% elif discharge_active___SLOT__ %}
    {{ discharge_target___SLOT__ | float(0) }}
  {% elif charge_active___SLOT__ %}
    {{ 0 - (charge_target___SLOT__ | float(0)) }}
  {% elif neutral_hold_active___SLOT__ %}
    {{ neutral_target___SLOT__ | float(0) }}
  {% else %}
    0
  {% endif %}
desired_target_sign___SLOT__: >-
  {% if signed_target___SLOT__ | float(0) > 0 %}
    1
  {% elif signed_target___SLOT__ | float(0) < 0 %}
    -1
  {% else %}
    0
  {% endif %}
responsive_target_allowed___SLOT__: >-
  {{ (
       desired_target_sign___SLOT__ | int(0) == 1
       and discharge_buffer___SLOT__ | bool
     )
     or (
       desired_target_sign___SLOT__ | int(0) == -1
       and charge_buffer___SLOT__ | bool
     ) }}
current_target_for_control___SLOT__: >-
  {% set current = slot___SLOT___current_target_w | float(0) %}
  {% if battery___SLOT___target_power_uses_absolute_value | bool
        and desired_target_sign___SLOT__ | int(0) == -1
        and current > 0 %}
    {{ 0 - current }}
  {% else %}
    {{ current }}
  {% endif %}
current_target_sign_for_control___SLOT__: >-
  {% if current_target_for_control___SLOT__ | float(0) > 0 %}
    1
  {% elif current_target_for_control___SLOT__ | float(0) < 0 %}
    -1
  {% else %}
    0
  {% endif %}
current_target_rounded___SLOT__: "{{ current_target_for_control___SLOT__ | float(0) | round(0) | int(0) }}"
desired_target_rounded___SLOT__: "{{ signed_target___SLOT__ | float(0) | round(0) | int(0) }}"
target_value_changed___SLOT__: "{{ desired_target_rounded___SLOT__ | int(0) != current_target_rounded___SLOT__ | int(0) }}"
same_direction_target_delta_w___SLOT__: "{{ (desired_target_rounded___SLOT__ | int(0) - current_target_rounded___SLOT__ | int(0)) | abs }}"
same_direction_small_adjustment___SLOT__: >-
  {{ target_value_changed___SLOT__ | bool
     and desired_target_sign___SLOT__ | int(0) != 0
     and desired_target_sign___SLOT__ | int(0) == current_target_sign_for_control___SLOT__ | int(0)
     and discharge_rebalance_delta___SLOT__ | float(0) == 0
     and same_direction_target_delta_w___SLOT__ | float(0) < control_deadband_w | float(0) }}
direction_action_retry_interval_s___SLOT__: "{{ [60, battery___SLOT___cooldown_seconds | float(0) * 3] | max }}"
absolute_direction_action_retry_due___SLOT__: >-
  {% set retry_interval = direction_action_retry_interval_s___SLOT__ | float(60) %}
  {{ slot___SLOT___target_age_s | float(0) >= retry_interval
     and ((slot___SLOT___target_age_s | float(0)) % retry_interval) < 60 }}
discharge_direction_confirmed___SLOT__: >-
  {{ slot___SLOT___actual_power_usable | bool
     and slot___SLOT___actual_discharge_w | float(0) > control_deadband_w | float(0) }}
charge_direction_confirmed___SLOT__: >-
  {{ slot___SLOT___actual_power_usable | bool
     and slot___SLOT___actual_charge_w | float(0) > control_deadband_w | float(0) }}
absolute_discharge_action_guard_due___SLOT__: >-
  {{ battery___SLOT___target_power_uses_absolute_value | bool
     and slot___SLOT___has_discharge_actions | bool
     and signed_target___SLOT__ | float(0) > 0
     and not (target_value_changed___SLOT__ | bool)
     and not (discharge_direction_confirmed___SLOT__ | bool)
     and (
       slot___SLOT___target_age_s | float(0) < slot___SLOT___response_grace_s | float(0)
       or absolute_direction_action_retry_due___SLOT__ | bool
     ) }}
absolute_charge_action_guard_due___SLOT__: >-
  {{ battery___SLOT___target_power_uses_absolute_value | bool
     and slot___SLOT___has_charge_actions | bool
     and signed_target___SLOT__ | float(0) < 0
     and not (target_value_changed___SLOT__ | bool)
     and not (charge_direction_confirmed___SLOT__ | bool)
     and (
       slot___SLOT___target_age_s | float(0) < slot___SLOT___response_grace_s | float(0)
       or absolute_direction_action_retry_due___SLOT__ | bool
     ) }}
direction_change_blocked_by_cooldown___SLOT__: >-
  {{ desired_target_sign___SLOT__ | int(0) != 0
     and current_target_sign_for_control___SLOT__ | int(0) != 0
     and desired_target_sign___SLOT__ | int(0) != current_target_sign_for_control___SLOT__ | int(0)
     and not (triggered_by_off_peak_entity | bool)
     and slot___SLOT___target_age_s | float(0) < slot___SLOT___response_grace_s | float(0) }}
start_from_zero_flow_confirmed___SLOT__: >-
  {{ current_target_sign_for_control___SLOT__ | int(0) == 0
     and allow_confirmed_flow_start_from_zero | bool
     and (
       (desired_target_sign___SLOT__ | int(0) == 1
        and house_power_valid
        and house_power_w | float(0) >= control_deadband_w | float(0)
        and (
          discharge_buffer___SLOT__ | bool
          or discharge_cooldown_ok___SLOT__ | bool
        ))
       or
       (desired_target_sign___SLOT__ | int(0) == -1
        and house_power_valid
        and house_power_w | float(0) <= 0 - (control_deadband_w | float(0))
        and (
          charge_buffer___SLOT__ | bool
          or charge_cooldown_ok___SLOT__ | bool
        ))
     ) }}
discharge_increase_blocked_by_locked_reduction___SLOT__: >-
  {{ locked_discharge_reduction_pending | bool
     and signed_target___SLOT__ | float(0) > slot___SLOT___current_target_w | float(0)
     and signed_target___SLOT__ | float(0) > 0
     and (signed_target___SLOT__ | float(0) - slot___SLOT___current_target_w | float(0)) > [house_power_w | float(0), 0] | max
     and not (discharge_export_guard_active | bool) }}
should_write_target_power___SLOT__: >-
  {% if not slot___SLOT___target_entity_configured %}
    false
  {% elif desired_target_sign___SLOT__ | int(0) == 0 %}
    {{ current_target_sign_for_control___SLOT__ | int(0) != 0 }}
  {% elif direction_change_blocked_by_cooldown___SLOT__ | bool %}
    false
  {% elif desired_target_sign___SLOT__ | int(0) != current_target_sign_for_control___SLOT__ | int(0)
        and current_target_sign_for_control___SLOT__ | int(0) != 0 %}
    true
  {% elif not (target_value_changed___SLOT__ | bool) %}
    false
  {% elif same_direction_small_adjustment___SLOT__ | bool %}
    false
  {% elif discharge_increase_blocked_by_locked_reduction___SLOT__ | bool %}
    false
  {% elif start_from_zero_flow_confirmed___SLOT__ | bool %}
    true
  {% elif signed_target___SLOT__ | float(0) > 0 %}
    {{ discharge_cooldown_ok___SLOT__
       or (discharge_export_guard_active
           and slot___SLOT___current_target_w | float(0) > 0
           and signed_target___SLOT__ | float(0) < slot___SLOT___current_target_w | float(0)) }}
  {% elif signed_target___SLOT__ | float(0) < 0 %}
    {{ charge_cooldown_ok___SLOT__
       or (
         responsive_target_allowed___SLOT__ | bool
         and forced_solar_output_active | bool
         and signed_target___SLOT__ | float(0) < current_target_for_control___SLOT__ | float(0)
       )
       }}
  {% else %}
    false
  {% endif %}
should_run_discharge_actions___SLOT__: >-
  {% if not slot___SLOT___has_discharge_actions %}
    false
  {% elif direction_change_blocked_by_cooldown___SLOT__ | bool %}
    false
  {% elif signed_target___SLOT__ | float(0) <= 0 %}
    {{ (
         current_target_sign_for_control___SLOT__ | int(0) == 1
         and target_value_changed___SLOT__ | bool
       ) or (
         slot___SLOT___actual_power_usable | bool
         and slot___SLOT___actual_discharge_w | float(0) > control_deadband_w | float(0)
         and (
           discharge_cooldown_ok___SLOT__ | bool
           or full_solar_charge_stop_required___SLOT__ | bool
         )
       ) }}
  {% elif discharge_increase_blocked_by_locked_reduction___SLOT__ | bool %}
    false
  {% elif current_target_sign_for_control___SLOT__ | int(0) != 1 %}
    {{ start_from_zero_flow_confirmed___SLOT__ | bool
       or (responsive_target_allowed___SLOT__ | bool and signed_target___SLOT__ | float(0) > 0)
       or current_target_sign_for_control___SLOT__ | int(0) != 0 }}
  {% elif absolute_discharge_action_guard_due___SLOT__ | bool %}
    true
  {% elif not (target_value_changed___SLOT__ | bool) %}
    false
  {% elif same_direction_small_adjustment___SLOT__ | bool %}
    false
  {% else %}
    {{ discharge_cooldown_ok___SLOT__
       or (discharge_export_guard_active
           and slot___SLOT___current_target_w | float(0) > 0
           and signed_target___SLOT__ | float(0) < slot___SLOT___current_target_w | float(0)) }}
  {% endif %}
should_run_charge_actions___SLOT__: >-
  {% if not slot___SLOT___has_charge_actions %}
    false
  {% elif direction_change_blocked_by_cooldown___SLOT__ | bool %}
    false
  {% elif signed_target___SLOT__ | float(0) >= 0 %}
    {{ (
         current_target_sign_for_control___SLOT__ | int(0) == -1
         and target_value_changed___SLOT__ | bool
       ) or (
         slot___SLOT___actual_power_usable | bool
         and slot___SLOT___actual_charge_w | float(0) > control_deadband_w | float(0)
         and charge_cooldown_ok___SLOT__ | bool
       ) }}
  {% elif current_target_sign_for_control___SLOT__ | int(0) != -1 %}
    {{ start_from_zero_flow_confirmed___SLOT__ | bool
       or (responsive_target_allowed___SLOT__ | bool and signed_target___SLOT__ | float(0) < 0)
       or current_target_sign_for_control___SLOT__ | int(0) != 0 }}
  {% elif absolute_charge_action_guard_due___SLOT__ | bool %}
    true
  {% elif not (target_value_changed___SLOT__ | bool) %}
    false
  {% elif same_direction_small_adjustment___SLOT__ | bool %}
    false
  {% else %}
    {{ charge_cooldown_ok___SLOT__
       or (
         responsive_target_allowed___SLOT__ | bool
         and forced_solar_output_active | bool
         and signed_target___SLOT__ | float(0) < current_target_for_control___SLOT__ | float(0)
       ) }}
  {% endif %}
