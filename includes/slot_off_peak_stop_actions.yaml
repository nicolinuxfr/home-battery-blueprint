- alias: "[[slot.__SLOT__]]: [[trace.off_peak_stop_discharge_suffix]]"
  choose:
    - alias: "[[slot.__SLOT__]]: [[trace.off_peak_stop_discharge_branch_suffix]]"
      conditions:
        - condition: template
          value_template: "{{ should_stop_off_peak_discharge___SLOT__ }}"
      sequence:
        - alias: "[[slot.__SLOT__]]: [[trace.off_peak_prepare_stop_context_suffix]]"
          variables:
            battery_slot: __SLOT__
            battery_soc: "{{ slot___SLOT___soc }}"
            house_power_w: "{{ house_power_w }}"
            import_need_w: "{{ import_need_w }}"
            export_surplus_w: "{{ export_surplus_w }}"
            off_peak_active: "{{ off_peak_active }}"
            target_power_w: 0
            target_discharge_w: 0
            target_charge_w: 0
        - alias: "[[slot.__SLOT__]]: [[trace.off_peak_select_stop_service_suffix]]"
          choose:
            - conditions:
                - condition: template
                  value_template: "{{ battery___SLOT___target_power_entity.startswith('number.') }}"
              sequence:
                - alias: "[[slot.__SLOT__]]: [[trace.off_peak_write_number_stop_suffix]]"
                  action: number.set_value
                  continue_on_error: true
                  target:
                    entity_id: "{{ battery___SLOT___target_power_entity }}"
                  data:
                    value: 0
            - conditions:
                - condition: template
                  value_template: "{{ battery___SLOT___target_power_entity.startswith('input_number.') }}"
              sequence:
                - alias: "[[slot.__SLOT__]]: [[trace.off_peak_write_input_number_stop_suffix]]"
                  action: input_number.set_value
                  continue_on_error: true
                  target:
                    entity_id: "{{ battery___SLOT___target_power_entity }}"
                  data:
                    value: 0
- alias: "[[slot.__SLOT__]]: [[trace.off_peak_run_discharge_stop_actions_suffix]]"
  choose:
    - alias: "[[slot.__SLOT__]]: [[trace.off_peak_discharge_stop_actions_branch_suffix]]"
      conditions:
        - condition: template
          value_template: "{{ should_run_off_peak_discharge_stop_actions___SLOT__ }}"
      sequence:
        - alias: "[[slot.__SLOT__]]: [[trace.off_peak_prepare_discharge_stop_context_suffix]]"
          variables:
            battery_slot: __SLOT__
            battery_soc: "{{ slot___SLOT___soc }}"
            house_power_w: "{{ house_power_w }}"
            import_need_w: "{{ import_need_w }}"
            export_surplus_w: "{{ export_surplus_w }}"
            off_peak_active: "{{ off_peak_active }}"
            target_power_w: 0
            target_discharge_w: 0
            target_charge_w: 0
        - alias: "[[slot.__SLOT__]]: [[trace.off_peak_execute_discharge_stop_actions_suffix]]"
          choose: []
          default: !input battery___SLOT___discharge_actions
